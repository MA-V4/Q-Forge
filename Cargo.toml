[workspace]
resolver = "2"
members = [
    "crates/qforge-ir",
    "crates/qforge-parser",
    "crates/qforge-optimizer",
    "crates/qforge-routing",
    "crates/qforge-noise",
    "crates/qforge-simulator",
    "crates/qforge-bench",
    "crates/qforge-server",
    "crates/qforge-cli",
]

[workspace.dependencies]
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
tokio        = { version = "1", features = ["full"] }
thiserror    = "1"
anyhow       = "1"
nalgebra     = "0.32"
num-complex  = "0.4"
rayon        = "1"
tracing      = "0.1"
